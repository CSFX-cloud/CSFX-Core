name: Frontend

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "app/**"
      - ".github/workflows/frontend.yml"
  push:
    branches:
      - main
    paths:
      - "app/**"
      - ".github/workflows/frontend.yml"
  workflow_dispatch:

concurrency:
  group: frontend-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: app

jobs:
  tailwind-lint:
    name: Tailwind lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci

      - name: Lint Tailwind classes
        run: |
          npx tailwind-lint "src/**/*.{svelte,css,ts}" --format json > tailwind-lint.json
          jq -r '.files[] | .path as $path | .diagnostics[] | "\($path):\(.line):\(.column) \(.severity) \(.message)"' tailwind-lint.json
          jq -e '.summary.errors + .summary.warnings == 0' tailwind-lint.json >/dev/null

  e2e:
    name: Playwright
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            app/playwright-report
            app/test-results
          retention-days: 14
