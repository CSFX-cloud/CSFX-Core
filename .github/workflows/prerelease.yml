name: Pre-release Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Pre-release version (e.g. 1.2.3-alpha.1)"
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  version:
    name: Resolve Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Validate version
        id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          VERSION="${INPUT_VERSION#v}"
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$' || { echo "invalid version: $VERSION"; exit 1; }
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Validate release notes
        uses: ./.github/actions/release-notes
        with:
          version: ${{ steps.v.outputs.version }}

  build-binaries:
    name: Build ${{ matrix.binary }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: version
    strategy:
      fail-fast: false
      matrix:
        binary:
          - csfx-updater
          - csfx-agent
          - csfx-guest-init
        arch:
          - amd64
          - arm64
        include:
          - arch: amd64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - arch: arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update
          if [ "${{ matrix.arch }}" = "amd64" ]; then
            sudo apt-get install -y musl-tools protobuf-compiler
          else
            sudo apt-get install -y gcc-aarch64-linux-gnu musl-tools protobuf-compiler
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.binary }}-${{ matrix.arch }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Build
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: aarch64-linux-gnu-gcc
          CSFX_BUILD_VERSION: ${{ needs.version.outputs.version }}
        run: |
          cargo build --release --bin ${{ matrix.binary }} --target ${{ matrix.target }}
          cp target/${{ matrix.target }}/release/${{ matrix.binary }} ${{ matrix.binary }}-${{ matrix.arch }}
          sha256sum ${{ matrix.binary }}-${{ matrix.arch }} > ${{ matrix.binary }}-${{ matrix.arch }}.sha256

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.binary }}-${{ matrix.arch }}
          path: |
            ${{ matrix.binary }}-${{ matrix.arch }}
            ${{ matrix.binary }}-${{ matrix.arch }}.sha256
          retention-days: 7

  build-frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    needs: version
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Build
        working-directory: app
        env:
          VITE_API_URL: ""
        run: npm run build

      - name: Archive
        run: tar -czf csfx-frontend.tar.gz -C app/build .

      - name: Checksum
        run: sha256sum csfx-frontend.tar.gz > csfx-frontend.tar.gz.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: csfx-frontend
          path: |
            csfx-frontend.tar.gz
            csfx-frontend.tar.gz.sha256
          retention-days: 7

  build-cp-binaries:
    name: Build CP ${{ matrix.binary }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: version
    strategy:
      fail-fast: false
      matrix:
        binary:
          - api-gateway
          - registry
          - scheduler
          - volume-manager
          - failover-controller
          - sdn-controller
          - object-storage
          - site-builder
          - csfx-migrate
        arch:
          - amd64
          - arm64
        include:
          - arch: amd64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - arch: arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update
          if [ "${{ matrix.arch }}" = "amd64" ]; then
            sudo apt-get install -y musl-tools protobuf-compiler libpq-dev
          else
            sudo apt-get install -y gcc-aarch64-linux-gnu musl-tools protobuf-compiler libpq-dev
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cp-${{ matrix.binary }}-${{ matrix.arch }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Build
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: aarch64-linux-gnu-gcc
          CSFX_BUILD_VERSION: ${{ needs.version.outputs.version }}
        run: |
          cargo build --release --bin ${{ matrix.binary }} --target ${{ matrix.target }}
          cp target/${{ matrix.target }}/release/${{ matrix.binary }} csfx-cp-${{ matrix.binary }}-${{ matrix.arch }}
          sha256sum csfx-cp-${{ matrix.binary }}-${{ matrix.arch }} > csfx-cp-${{ matrix.binary }}-${{ matrix.arch }}.sha256

      - uses: actions/upload-artifact@v7
        with:
          name: csfx-cp-${{ matrix.binary }}-${{ matrix.arch }}
          path: |
            csfx-cp-${{ matrix.binary }}-${{ matrix.arch }}
            csfx-cp-${{ matrix.binary }}-${{ matrix.arch }}.sha256
          retention-days: 7

  github-release:
    name: GitHub Pre-release
    runs-on: ubuntu-latest
    needs: [version, build-binaries, build-cp-binaries, build-frontend]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: csfx-*
          merge-multiple: true

      - uses: actions/download-artifact@v8
        with:
          name: release-notes
          path: release-notes

      - name: Create pre-release
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          CP_BINS=""
          for svc in api-gateway registry scheduler volume-manager failover-controller sdn-controller object-storage site-builder csfx-migrate; do
            for arch in amd64 arm64; do
              CP_BINS="${CP_BINS} csfx-cp-${svc}-${arch} csfx-cp-${svc}-${arch}.sha256"
            done
          done

          gh release create "v${VERSION}" \
            --title "v${VERSION}" \
            --prerelease \
            --notes-file release-notes/release-notes.md \
            csfx-updater-amd64 \
            csfx-updater-amd64.sha256 \
            csfx-updater-arm64 \
            csfx-updater-arm64.sha256 \
            csfx-agent-amd64 \
            csfx-agent-amd64.sha256 \
            csfx-agent-arm64 \
            csfx-agent-arm64.sha256 \
            csfx-guest-init-amd64 \
            csfx-guest-init-amd64.sha256 \
            csfx-guest-init-arm64 \
            csfx-guest-init-arm64.sha256 \
            csfx-frontend.tar.gz \
            csfx-frontend.tar.gz.sha256 \
            release-notes/* \
            ${CP_BINS}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-infra:
    name: Open CSFX-Infra release PR
    needs: [version, build-binaries, build-cp-binaries, build-frontend, github-release]
    uses: ./.github/workflows/update-infra.yml
    with:
      version: ${{ needs.version.outputs.version }}
    secrets:
      INFRA_REPO_TOKEN: ${{ secrets.INFRA_REPO_TOKEN }}
